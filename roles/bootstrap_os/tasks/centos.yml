---
- name: Bootstrap Python
  when: bootstrap_os_install_python
  block:
    - name: Check if Python bootstrap is needed
      vars:
        python_interpreter: "{{ lookup('config', 'INTERPRETER_PYTHON') | trim }}"
        python_candidates: >-
          {{ lookup('config', 'INTERPRETER_PYTHON_FALLBACK')
             if python_interpreter in ['', 'auto', 'auto_silent'] else [python_interpreter] }}
      raw: |
        for python in {{ python_candidates | map('quote') | join(' ') }}; do
          if command -v "$python" >/dev/null 2>&1; then
            "$python" -c 'import sys; sys.exit(sys.version_info[:2] < (3, 9))'
            exit $?
          fi
        done
        exit 1
      register: need_bootstrap
      changed_when: false
      failed_when: need_bootstrap.rc not in [0, 1]
      check_mode: false

    # Keep platform-python for the ansible-core DNF helper.
    - name: Install Python 3.12
      raw: >-
        yum --assumeyes
        {% if not skip_http_proxy_on_os_packages and http_proxy is defined %}
        --setopt={{ ('proxy=' ~ http_proxy) | quote }}
        {% endif %}
        install python3.12
      become: true
      register: bootstrap_python
      until: bootstrap_python is succeeded
      retries: "{{ pkg_install_retries }}"
      delay: "{{ retry_stagger | random + 3 }}"
      timeout: "{{ pkg_install_timeout }}"
      when: need_bootstrap.rc != 0

- name: Gather host facts to get ansible_distribution_version ansible_distribution_major_version
  setup:
    gather_subset: '!all'
    filter: ansible_distribution_*version

- name: Add proxy to yum.conf or dnf.conf if http_proxy is defined
  community.general.ini_file:
    path: "{{ ((ansible_facts['distribution_major_version'] | int) < 8) | ternary('/etc/yum.conf', '/etc/dnf/dnf.conf') }}"
    section: main
    option: proxy
    value: "{{ http_proxy | default(omit) }}"
    state: "{{ http_proxy | default(False) | ternary('present', 'absent') }}"
    no_extra_spaces: true
    mode: "0644"
  become: true
  when: not skip_http_proxy_on_os_packages

# For Oracle Linux install public repo

- name: Install EPEL for Oracle Linux repo package
  package:
    name: "oracle-epel-release-el{{ ansible_facts['distribution_major_version'] }}"
    state: present
  when:
    - use_oracle_public_repo
    - '''ID="ol"'' in os_release.stdout_lines'
    - (ansible_facts['distribution_version'] | float) >= 7.6

- name: Enable Oracle Linux repo
  community.general.ini_file:
    dest: "/etc/yum.repos.d/oracle-linux-ol{{ ansible_facts['distribution_major_version'] }}.repo"
    section: "ol{{ ansible_facts['distribution_major_version'] }}_addons"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    mode: "0644"
  with_items:
    - { option: "name", value: "ol{{ ansible_facts['distribution_major_version'] }}_addons" }
    - { option: "enabled", value: "1" }
    - { option: "baseurl", value: "http://yum.oracle.com/repo/OracleLinux/OL{{ ansible_facts['distribution_major_version'] }}/addons/$basearch/" }
  when:
    - use_oracle_public_repo
    - '''ID="ol"'' in os_release.stdout_lines'
    - (ansible_facts['distribution_version'] | float) >= 7.6

- name: Enable Centos extra repo for Oracle Linux
  community.general.ini_file:
    dest: "/etc/yum.repos.d/centos-extras.repo"
    section: "extras"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    mode: "0644"
  with_items:
    - { option: "name", value: "CentOS-{{ ansible_facts['distribution_major_version'] }} - Extras" }
    - { option: "enabled", value: "1" }
    - { option: "gpgcheck", value: "0" }
    - { option: "baseurl", value: "http://mirror.centos.org/centos/{{ ansible_facts['distribution_major_version'] }}/extras/$basearch/os/" }
  when:
    - use_oracle_public_repo
    - '''ID="ol"'' in os_release.stdout_lines'
    - (ansible_facts['distribution_version'] | float) >= 7.6
    - (ansible_facts['distribution_version'] | float) < 9

- name: Check presence of fastestmirror.conf
  stat:
    path: /etc/yum/pluginconf.d/fastestmirror.conf
    get_attributes: false
    get_checksum: false
    get_mime: false
  register: fastestmirror

# the fastestmirror plugin can actually slow down Ansible deployments
- name: Disable fastestmirror plugin if requested
  lineinfile:
    dest: /etc/yum/pluginconf.d/fastestmirror.conf
    regexp: "^enabled=.*"
    line: "enabled=0"
    state: present
  become: true
  when:
    - fastestmirror.stat.exists
    - not centos_fastestmirror_enabled
