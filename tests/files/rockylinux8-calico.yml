---
# Instance settings
cloud_image: rockylinux-8
vm_memory: 3072

# Kubespray settings
bootstrap_os_install_python: true
metrics_server_enabled: true
loadbalancer_apiserver_type: haproxy

# Experimental EL8 coverage with kernel 4.18 and cgroup v1.
kubeadm_ignore_preflight_errors:
  - SystemVerification
kubelet_fail_cgroup_v1: false
