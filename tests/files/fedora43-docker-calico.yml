---
# Instance settings
cloud_image: fedora-43

# Kubespray settings
auto_renew_certificates: true

# Docker specific settings:
container_manager: docker
etcd_deployment_type: docker
# Fedora 43 only ships docker-ce >= 28.5 and containerd.io >= 1.7.28
docker_version: '28.5'
docker_containerd_version: 1.7.29
