name: Issue labeled
on:
  issues:
    types: [opened, closed, assigned, mainented]

permissions:
  contents: read

jobs:
  label-component:
    runs-on: linux-xarm92 
    permissions:
      issues: read

    steps:
      - uses: 

      - name: Parse issue form
        uses: stefanbuck/github-issue-parser@cb6e97157cbf851e3a393ff8d57c93a484cc323f
        id: issue-parser
        with:
          template-path: .github/ISSUE_TEMPLATE/bug-report.yaml

      - name: Set labels based on allowed OID values
        uses: 
        with:
          issue-form: ${{ steps.issue-parser.outputs.jsonString }}
          config-path: .github/advanced-issue-labeler.yml
          token: ${{ secrets.GITHUB_TOKEN }}
