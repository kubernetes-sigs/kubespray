---
- name: Crun | Resolve download spec
  set_fact:
    _crun_download: "{{ download_defaults | combine(downloads_file.crun) }}"

- name: Crun | Download crun binary
  include_tasks: "../../../download/tasks/download_file.yml"
  vars:
    download: "{{ _crun_download }}"

- name: Copy crun binary from download dir
  copy:
    src: "{{ _crun_download.dest }}"
    dest: "{{ bin_dir }}/crun"
    mode: "0755"
    remote_src: true
