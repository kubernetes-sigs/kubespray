---
- name: GVisor | Download gvisor archive
  include_tasks: "../../../download/tasks/download_file.yml"
  vars:
    download: "{{ download_defaults | combine(downloads.gvisor_archive) }}"

- name: GVisor | Copy binaries from extracted archive
  copy:
    src: "{{ item.src }}"
    dest: "{{ bin_dir }}/{{ item.dest }}"
    mode: "0755"
    remote_src: true
  with_items:
    - { src: "{{ downloads.gvisor_archive.dest | dirname }}/runsc", dest: "runsc" }
    - { src: "{{ downloads.gvisor_archive.dest | dirname }}/containerd-shim-runsc-v1", dest: "containerd-shim-runsc-v1" }

# runsc looks for the gvisor-bin/ sidecar directory next to its own binary,
# so the whole extracted tree must live in bin_dir (per gvisor install docs).
