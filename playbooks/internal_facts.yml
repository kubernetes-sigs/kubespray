---
- name: Bootstrap hosts for Ansible
  hosts: k8s_cluster:etcd:calico_rr
  strategy: linear
  any_errors_fatal: "{{ any_errors_fatal | default(true) }}"
  gather_facts: false
  environment: "{{ proxy_disable_env }}"
  roles:
    - { role: bootstrap_os, tags: bootstrap_os}

- name: Gather facts
  hosts: k8s_cluster:etcd:calico_rr:localhost
  gather_facts: false
  become: "{{ inventory_hostname != 'localhost' }}"
  # root isn't needed for facts and Ansible often does not have root access on
  # the control node
  # TODO: unconditionally use become: false
  # low priority
  # This isn't possible for now because several place in Kubespray rely on
  # ansible_facts['env'] (notably: kubeadm) being from the become user (for PATH, HOME)
  tags: always
  tasks:
    - name: Gather and compute network facts
      import_role:
        name: network_facts
      tags:
        - always
    - name: Gather minimal facts
      setup:
        gather_subset: '!all'

    # filter match the following variables:
    # ansible_default_ipv4
    # ansible_default_ipv6
    # ansible_all_ipv4_addresses
    # ansible_all_ipv6_addresses
    - name: Gather necessary facts (network)
      setup:
        gather_subset: '!all,!min,network'
        filter: "ansible_*_ipv[46]*"

    # filter match the following variables:
    # ansible_memtotal_mb
    # ansible_swaptotal_mb
    - name: Gather necessary facts (hardware)
      setup:
        gather_subset: '!all,!min,hardware'
        filter: "ansible_*total_mb"
