---
# kubeadm generates controller-manager.conf and scheduler.conf from
# localAPIEndpoint, and kubelet.conf points at the local apiserver as well
# through ControlPlaneKubeletLocalMode. admin.conf is the exception: it is
# always generated from controlPlaneEndpoint, which is the first control plane
# node when no external load balancer is configured.
- name: Update server field in admin kubeconfig
  lineinfile:
    dest: "{{ kube_config_dir }}/admin.conf"
    regexp: '^(\s*)server: .*$'
    line: '\1server: {{ kube_apiserver_endpoint }}'
    backrefs: true
    backup: true
