---
- name: GVisor | Resolve runsc download spec
  set_fact:
    _gvisor_runsc_download: "{{ download_defaults | combine(downloads_file.gvisor_runsc) }}"

- name: GVisor | Download runsc binary
  include_tasks: "../../../download/tasks/download_file.yml"
  vars:
    download: "{{ _gvisor_runsc_download }}"

- name: GVisor | Resolve containerd-shim-runsc-v1 download spec
  set_fact:
    _gvisor_containerd_shim_download: "{{ download_defaults | combine(downloads_file.gvisor_containerd_shim) }}"

- name: GVisor | Download containerd-shim-runsc-v1 binary
  include_tasks: "../../../download/tasks/download_file.yml"
  vars:
    download: "{{ _gvisor_containerd_shim_download }}"

- name: GVisor | Copy binaries
  copy:
    src: "{{ item.src }}"
    dest: "{{ bin_dir }}/{{ item.dest }}"
    mode: "0755"
    remote_src: true
  with_items:
    - { src: "{{ _gvisor_runsc_download.dest }}", dest: "runsc" }
    - { src: "{{ _gvisor_containerd_shim_download.dest }}", dest: "containerd-shim-runsc-v1" }
