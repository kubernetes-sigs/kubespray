---
# Instance settings
cloud_image: almalinux-8
vm_memory: 3072

# Exercise Python installation before gathering facts.
bootstrap_os_install_python: true

# EL8 glibc is older than required by the dynamically linked containerd binaries.
containerd_static_binary: true

# Experimental EL8 coverage with kernel 4.18 and cgroup v1.
kubeadm_ignore_preflight_errors:
  - SystemVerification
kubelet_fail_cgroup_v1: false
