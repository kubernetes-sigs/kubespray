---
# Registries defined within cri-o.
# Unqualified (short) image names, such as "redis:7.0.15-alpine", are resolved against
# the registries flagged with "unqualified: true". CRI-O refuses to pull short names when
# no such registry is configured, which is the case with "crio_registries: []".
crio_registries:
  - prefix: docker.io
    insecure: false
    blocked: false
    location: registry-1.docker.io
    unqualified: true

# Add mirrors to the registry above, for instance:
#    mirrors:
#      - location: mirror.gcr.io
#        insecure: false
#      - location: 192.168.100.100:5000
#        insecure: true

# Insecure registries, TLS verification is skipped for them
# crio_insecure_registries:
#   - 10.0.0.2:5000

# Auth config for the registries
# crio_registry_auth:
#   - registry: 10.0.0.2:5000
#     username: user
#     password: pass
