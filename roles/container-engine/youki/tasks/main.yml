---
- name: Youki | Resolve download spec
  set_fact:
    _youki_download: "{{ download_defaults | combine(downloads_file.youki) }}"

- name: Youki | Download youki
  include_tasks: "../../../download/tasks/download_file.yml"
  vars:
    download: "{{ _youki_download }}"

- name: Youki | Copy youki binary from download dir
  copy:
    src: "{{ local_release_dir }}/youki"
    dest: "{{ youki_bin_dir }}/youki"
    mode: "0755"
    remote_src: true
