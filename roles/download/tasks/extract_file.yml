---
- name: Extract_file | Unpacking archive
  unarchive:
    src: "{{ download.dest }}"
    dest: "{{ download.dest | dirname }}"
    mode: "a-x,u=rwX,go=rX"
    # directory: 0755, file: 0644
    remote_src: true
    extra_opts: "{{ download.unarchive_extra_opts | default(omit) }}"
  when:
    - download.unarchive | default(false)
