---
- name: Calico | Install Wireguard packages
  package:
    name: "{{ item }}"
    state: present
  with_items: "{{ calico_wireguard_packages }}"
  register: calico_package_install
  until: calico_package_install is succeeded
  retries: 4
  when: calico_wireguard_enabled

- name: Calico | Copy calicoctl binary from download dir
  copy:
    src: "{{ downloads.calicoctl.dest }}"
    dest: "{{ bin_dir }}/calicoctl"
    mode: "0755"
    remote_src: true

- name: Calico | Install calicoctl wrapper script
  template:
    src: "calicoctl.sh.j2"
    dest: "{{ bin_dir }}/calicoctl.sh"
    mode: "0755"
    owner: root
    group: root

# The cluster-wide tasks use groups['kube_control_plane'][0], because run_once runs once per serial batch
- name: Calico | Install the Tigera operator
  include_tasks: operator.yml
  when: inventory_hostname == groups['kube_control_plane'][0]

- name: Calico | Configure Calico resources
  import_tasks: config.yml

- name: Calico | Prepare the manifest-based Calico for the migration
  include_tasks: migrate_prepare.yml
  when: inventory_hostname == groups['kube_control_plane'][0]

- name: Calico | Deploy Calico with the operator
  include_tasks: installation.yml
  when: inventory_hostname == groups['kube_control_plane'][0]

- name: Calico | Remove the files of the manifest-based install
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ kube_config_dir }}/calico-config.yml"
    - "{{ kube_config_dir }}/calico-node.yml"
    - "{{ kube_config_dir }}/calico-node-sa.yml"
    - "{{ kube_config_dir }}/calico-cr.yml"
    - "{{ kube_config_dir }}/calico-crb.yml"
    - "{{ kube_config_dir }}/calico-typha.yml"
    - "{{ kube_config_dir }}/calico-apiserver.yml"
    - "{{ kube_config_dir }}/calico-apiserver-ns.yml"
    - "{{ kube_config_dir }}/calico-kube-controllers.yml"
    - "{{ kube_config_dir }}/calico-kube-sa.yml"
    - "{{ kube_config_dir }}/calico-kube-cr.yml"
    - "{{ kube_config_dir }}/calico-kube-crb.yml"
    - "{{ kube_config_dir }}/kdd-crds.yml"
    - "{{ kube_config_dir }}/kubernetes-services-endpoint.yml"
    - "{{ bin_dir }}/make-ssl-typha.sh"
    - "{{ bin_dir }}/make-ssl-apiserver.sh"
    - /etc/calico/certs
  when: inventory_hostname in groups['kube_control_plane']

- name: Wait for calico kubeconfig to be created
  wait_for:
    path: /etc/cni/net.d/calico-kubeconfig
    timeout: "{{ calico_kubeconfig_wait_timeout }}"
  when:
    - inventory_hostname not in groups['kube_control_plane']

- name: Calico | Peer with Calico Route Reflector
  include_tasks: peer_with_calico_rr.yml
  when:
    - peer_with_calico_rr

- name: Calico | Peer with the router
  include_tasks: peer_with_router.yml
  when:
    - peer_with_router
