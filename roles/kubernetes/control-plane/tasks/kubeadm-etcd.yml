---
- name: Ensure etcdctl and etcdutl script is installed
  import_role:
    name: etcdctl_etcdutl
  when: etcd_deployment_type == "kubeadm"
  tags:
    - etcdctl
    - etcdutl

- name: Set ownership for etcd data directory
  file:
    path: "{{ etcd_data_dir }}"
    owner: "{{ etcd_owner }}"
    group: "{{ etcd_owner }}"
    mode: "0700"
  when: etcd_deployment_type == "kubeadm"
