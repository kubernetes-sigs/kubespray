[ssh_connection]
pipelining=True
ansible_ssh_common_args = -o ControlMaster=auto -o ControlPersist=30m -o ConnectionAttempts=100
retries=2
[defaults]
forks = 20
host_key_checking=False
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp
stdout_callback = default
display_skipped_hosts = no
callbacks_enabled = ansible.posix.profile_tasks
jinja2_extensions = jinja2.ext.do
roles_path = ../roles
# ../ansible_collections/kubernetes_sigs/kubespray symlinks back to the repo root, so FQCN modules/roles resolve without a galaxy build/install
collections_path = ../ansible_collections
